<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Metal Eras | Tempo Real</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao()">>

    <div class="janela">

        <div class="header-left dash-header">

            <h1>The <span>Metal</span> Eras</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">
                <h3>Bandas Votadas</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Gráficos</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>


        <div class="dash">

            <div class="cabecalho-bandas">
                <h1>ESCOLHA A SUA <span>BANDA FAVORITA</span></h1>
                <p>Clique no card da banda que você mais gosta. Seu voto ajuda a definir as bandas
                    mais marcantes do rock
                </p>
            </div>


            <div class="cards">

                <button type="button" class="card-aquario banda-pink-floyd" onclick="votarPinkFloyd()">
                    <h2>Pink Floyd</h2>
                    <p>Votos: <span id="votos_pink">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-black-sabbath" onclick="votarBlackSabbath()">
                    <h2>Black Sabbath</h2>
                    <p>Votos: <span id="votos_sabbath">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-metallica" onclick="votarMetallica()">
                    <h2>Metallica</h2>
                    <p>Votos: <span id="votos_metallica">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-iron-maiden" onclick="votarIronMaiden()">
                    <h2>Iron Maiden</h2>
                    <p>Votos: <span id="votos_maiden">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-led-zeppelin" onclick="votarLedZeppelin()">
                    <h2>Led Zeppelin</h2>
                    <p>Votos: <span id="votos_zeppelin">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-judas-priest" onclick="votarJudasPriest()">
                    <h2>Judas Priest</h2>
                    <p>Votos: <span id="votos_priest">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-megadeth" onclick="votarMegadeth()">
                    <h2>Megadeth</h2>
                    <p>Votos: <span id="votos_megadeth">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-van-halen" onclick="votarVanHalen()">
                    <h2>Van Halen</h2>
                    <p>Votos: <span id="votos_vanhalen">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-guns-n-roses" onclick="votarGunsNRoses()">
                    <h2>Guns N' Roses</h2>
                    <p>Votos: <span id="votos_guns">0</span></p>
                </button>

                <button type="button" class="card-aquario banda-pantera" onclick="votarPantera()">
                    <h2>Pantera</h2>
                    <p>Votos: <span id="votos_pantera">0</span></p>
                </button>

            </div>


        </div>


    </div>

</body>

    var votosGunsNRoses = [];

    var jaVotou = false;


    function votarPinkFloyd() {

        if (jaVotou == true) {
            alert("Você já votou!");
        } else {
            votosPinkFloyd.push(1);
            votos_pink.innerHTML = votosPinkFloyd.length;

            jaVotou = true;
            alert("Voto registrado com sucesso!");
        }
    }

    function exibirAquarios() {
        JSON.parse(sessionStorage.AQUARIOS).forEach(item => {
            document.getElementById("cardAquarios").innerHTML += `
                    <div class="card-aquario">
                        <div class="title-aquario">
                            <h1>${item.descricao}</h1>
                        </div>
                        <div class="desc-aquario">
                        <div class="temperatura">
                            <p id="temp_aquario_${item.id}">-°C</p>
                        </div>
                        <div class="cor-alerta" id="card_${item.id}"></div>
                    </div>
                    </div>
                    `
        });
    }

</script>

</html>
